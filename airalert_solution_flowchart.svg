<svg viewBox="0 0 600 1395" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AirAlert solution flowchart. Part A: load hourly AQI data, clean it, build features and a spike label, split by time, train and evaluate a model. Part B: for each hourly reading, score the spike probability, then decide Alert, Watch or Low and show advice for each group, and repeat every hour." font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f62fe"/></marker></defs>
<rect width="600" height="1395" fill="#fbfcfe"/>
<text x="40" y="24" font-size="15" font-weight="700" fill="#0f62fe">Part A: prepare the data and train the model (done once)</text>
<path d="M40 32H560" stroke="#c9d3e3" stroke-width="1"/>
<rect x="40" y="44" width="300" height="52" rx="26" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="65.0" text-anchor="middle" font-size="12" fill="#14213d">Hourly AQI data, Hebbal station</text>
<text x="190.0" y="83.0" text-anchor="middle" font-size="12" fill="#14213d">48,312 hourly rows, Jun 2018 to Dec 2023</text>
<rect x="40" y="126" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="147.0" text-anchor="middle" font-size="12" fill="#14213d">Load the calendar-style CSV</text>
<text x="190.0" y="165.0" text-anchor="middle" font-size="12" fill="#14213d">into one hourly table</text>
<rect x="40" y="208" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="229.0" text-anchor="middle" font-size="12" fill="#14213d">Fill hourly gaps, blank out impossible</text>
<text x="190.0" y="247.0" text-anchor="middle" font-size="12" fill="#14213d">and stuck sensor readings (119 removed)</text>
<rect x="40" y="290" width="300" height="70" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="311.0" text-anchor="middle" font-size="12" fill="#14213d">Build features: recent values, rolling</text>
<text x="190.0" y="329.0" text-anchor="middle" font-size="12" fill="#14213d">averages, rate of rise, hour, month,</text>
<text x="190.0" y="347.0" text-anchor="middle" font-size="12" fill="#14213d">day of week</text>
<rect x="40" y="390" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="411.0" text-anchor="middle" font-size="12" fill="#14213d">Label each hour: does AQI go above 200</text>
<text x="190.0" y="429.0" text-anchor="middle" font-size="12" fill="#14213d">within the next 2 hours?</text>
<rect x="40" y="472" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="493.0" text-anchor="middle" font-size="12" fill="#14213d">Split by time: train on earlier dates,</text>
<text x="190.0" y="511.0" text-anchor="middle" font-size="12" fill="#14213d">test on later dates the model never saw</text>
<rect x="40" y="554" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="575.0" text-anchor="middle" font-size="12" fill="#14213d">Train a gradient boosting model</text>
<text x="190.0" y="593.0" text-anchor="middle" font-size="12" fill="#14213d">(scikit-learn)</text>
<rect x="40" y="636" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="657.0" text-anchor="middle" font-size="12" fill="#14213d">Compare with a simple baseline:</text>
<text x="190.0" y="675.0" text-anchor="middle" font-size="12" fill="#14213d">recall, precision, false alarm rate</text>
<path d="M190 96L190 126" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 178L190 208" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 260L190 290" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 360L190 390" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 442L190 472" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 524L190 554" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 606L190 636" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 688L190 736" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="202" y="716" font-size="12" fill="#56637a">trained model</text>
<text x="40" y="758" font-size="15" font-weight="700" fill="#0f62fe">Part B: decide for each hourly reading</text>
<path d="M40 766H560" stroke="#c9d3e3" stroke-width="1"/>
<rect x="40" y="778" width="300" height="52" rx="26" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="799.0" text-anchor="middle" font-size="12" fill="#14213d">A new hourly reading arrives</text>
<text x="190.0" y="817.0" text-anchor="middle" font-size="12" fill="#14213d">(replayed from the test period in the demo)</text>
<rect x="40" y="860" width="300" height="52" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="881.0" text-anchor="middle" font-size="12" fill="#14213d">Compute the same features and score the</text>
<text x="190.0" y="899.0" text-anchor="middle" font-size="12" fill="#14213d">chance of a spike (under 1 ms)</text>
<path d="M190 830L190 860" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M190 912L190 942" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<polygon points="190,942 340,992 190,1042 40,992" fill="#eef4ff" stroke="#0f62fe" stroke-width="1.5"/>
<text x="190" y="983" text-anchor="middle" font-size="12" fill="#14213d">AQI already above 200,</text>
<text x="190" y="1001" text-anchor="middle" font-size="12" fill="#14213d">or probability 0.5 or more?</text>
<path d="M190 1042L190 1072" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<polygon points="190,1072 340,1122 190,1172 40,1122" fill="#eef4ff" stroke="#0f62fe" stroke-width="1.5"/>
<text x="190" y="1113" text-anchor="middle" font-size="12" fill="#14213d">Probability 0.25 or more,</text>
<text x="190" y="1131" text-anchor="middle" font-size="12" fill="#14213d">or AQI up 40+ in 3 hours?</text>
<rect x="400" y="962" width="160" height="60" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="480.0" y="987.0" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Alert</text>
<text x="480.0" y="1005.0" text-anchor="middle" font-size="12" fill="#56637a">Take precautions now</text>
<rect x="400" y="1092" width="160" height="60" rx="6" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
<text x="480.0" y="1117.0" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Watch</text>
<text x="480.0" y="1135.0" text-anchor="middle" font-size="12" fill="#56637a">Prepare, limit time outdoors</text>
<rect x="40" y="1212" width="300" height="52" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="190.0" y="1233.0" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Low</text>
<text x="190.0" y="1251.0" text-anchor="middle" font-size="12" fill="#56637a">No special precautions expected</text>
<path d="M340 992L398 992" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="348" y="984" font-size="12" font-weight="700" fill="#14213d">Yes</text>
<path d="M340 1122L398 1122" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="348" y="1114" font-size="12" font-weight="700" fill="#14213d">Yes</text>
<text x="198" y="1064" font-size="12" font-weight="700" fill="#14213d">No</text>
<path d="M190 1172L190 1212" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="198" y="1196" font-size="12" font-weight="700" fill="#14213d">No</text>
<rect x="40" y="1306" width="300" height="66" rx="6" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="190.0" y="1325.0" text-anchor="middle" font-size="12" fill="#14213d">Show the tier with advice for</text>
<text x="190.0" y="1343.0" text-anchor="middle" font-size="12" fill="#14213d">schools, elderly, asthma or heart</text>
<text x="190.0" y="1361.0" text-anchor="middle" font-size="12" fill="#14213d">conditions, and outdoor workers</text>
<path d="M190 1264L190 1306" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M560 992H580V1339H342" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M560 1122H580" stroke="#0f62fe" stroke-width="2" fill="none"/>
<path d="M40 1339H20V804H38" stroke="#0f62fe" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
<text transform="translate(34 1090) rotate(-90)" font-size="12" fill="#56637a">repeat for the next hour</text>
</svg>