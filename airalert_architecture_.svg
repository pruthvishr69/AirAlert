<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AirAlert architecture: hourly AQI data flows through six stages on an IBM LinuxONE instance, from loading and preparing the data to training, deciding Low, Watch or Alert, replaying as a stream, and producing outputs." font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f62fe"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8793a8"/></marker></defs>
<rect width="960" height="600" fill="#fbfcfe"/>
<rect x="40" y="16" width="440" height="68" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="58" y="42" font-size="15" font-weight="700" fill="#14213d">CPCB hourly AQI, Hebbal station, Bengaluru</text>
<text x="58" y="64" font-size="12" fill="#56637a">OpenCity.in (Public Domain), Jun 2018 to Dec 2023, 48,312 hourly rows</text>
<rect x="520" y="16" width="400" height="68" rx="8" fill="#fbfcfe" stroke="#8793a8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="538" y="42" font-size="15" font-weight="700" fill="#56637a">Open-Meteo weather (optional)</text>
<text x="538" y="64" font-size="12" fill="#56637a">Supported by the code, not used in reported results</text>
<path d="M260 84V118" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M720 84V118" stroke="#8793a8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ahd)"/>
<rect x="20" y="122" width="920" height="398" rx="14" fill="#eef4ff" stroke="#0f62fe" stroke-width="2"/>
<text x="40" y="150" font-size="16" font-weight="700" fill="#0f62fe">IBM LinuxONE instance</text>
<text x="40" y="171" font-size="12" fill="#56637a">s390x, Big Endian, Python 3.12, 3 cores, about 8 GB memory, containerized environment</text>
<rect x="40" y="200" width="270" height="100" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="54" y="226" font-size="15" font-weight="700" fill="#14213d">1  loader.py</text>
<text x="54" y="248" font-size="12" fill="#56637a">Reads the calendar-style CSV and</text>
<text x="54" y="266" font-size="12" fill="#56637a">turns it into one hourly table</text>
<rect x="345" y="200" width="270" height="100" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="359" y="226" font-size="15" font-weight="700" fill="#14213d">2  prepare.py</text>
<text x="359" y="248" font-size="12" fill="#56637a">Fills hourly gaps, drops stuck sensor</text>
<text x="359" y="266" font-size="12" fill="#56637a">readings, builds features and labels</text>
<text x="359" y="284" font-size="12" fill="#56637a">spikes (AQI above 200 within 2 hours)</text>
<rect x="650" y="200" width="270" height="100" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="664" y="226" font-size="15" font-weight="700" fill="#14213d">3  train.py</text>
<text x="664" y="248" font-size="12" fill="#56637a">Trains on earlier dates, tests on</text>
<text x="664" y="266" font-size="12" fill="#56637a">later ones. Gradient boosting model,</text>
<text x="664" y="284" font-size="12" fill="#56637a">compared against a simple baseline</text>
<rect x="40" y="370" width="270" height="100" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="54" y="396" font-size="15" font-weight="700" fill="#14213d">4  decide.py</text>
<text x="54" y="418" font-size="12" fill="#56637a">Turns spike probability into Low,</text>
<text x="54" y="436" font-size="12" fill="#56637a">Watch or Alert, with advice for</text>
<text x="54" y="454" font-size="12" fill="#56637a">schools, elderly, asthma, outdoor work</text>
<rect x="345" y="370" width="270" height="100" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="359" y="396" font-size="15" font-weight="700" fill="#14213d">5  replay.py</text>
<text x="359" y="418" font-size="12" fill="#56637a">Replays test-period readings in time</text>
<text x="359" y="436" font-size="12" fill="#56637a">order to simulate a stream and times</text>
<text x="359" y="454" font-size="12" fill="#56637a">every score (under 1 ms per reading)</text>
<rect x="650" y="370" width="270" height="100" rx="8" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/>
<text x="664" y="396" font-size="15" font-weight="700" fill="#14213d">6  Outputs</text>
<text x="664" y="418" font-size="12" fill="#56637a">Alerts with advice, accuracy results</text>
<text x="664" y="436" font-size="12" fill="#56637a">(results.txt) and screenshots as</text>
<text x="664" y="454" font-size="12" fill="#56637a">evidence for the judges</text>
<path d="M310 250H343" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M615 250H648" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M785 300V335H175V368" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M310 420H343" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M615 420H648" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="40" y="552" font-size="13" font-weight="700" fill="#14213d">Results on later, unseen data (95 real spikes in 9,811 hours)</text>
<text x="40" y="574" font-size="12.5" fill="#56637a">Watch level (probability 0.25) caught 50.5% of spikes. Alert level (0.5) caught 32.6%. A simple baseline caught 17.9%.</text>
</svg>